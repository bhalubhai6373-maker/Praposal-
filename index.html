<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hey Beautiful 👋🏻</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%);
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      position: relative;
    }

    .bg-heart {
      position: absolute;
      color: rgba(255, 255, 255, 0.6);
      animation: floatUp linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.5) rotate(0deg);
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) scale(1.3) rotate(360deg);
        opacity: 0;
      }
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 35px 20px;
      width: 88%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(220, 38, 38, 0.25);
      position: relative;
      z-index: 10;
      border: 3px solid rgba(255, 255, 255, 0.8);
    }

    .greeting {
      font-size: 1.5rem;
      color: #f43f5e;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .emoji-box {
      font-size: 80px;
      margin: 10px 0;
      display: inline-block;
      line-height: 1;
      animation: pulseEmoji 1.8s infinite ease-in-out;
    }

    @keyframes pulseEmoji {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15) rotate(-5deg); }
    }

    .bounce {
      animation: bounceAnim 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite alternate;
    }

    @keyframes bounceAnim {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-15px) scale(1.1); }
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.6rem;
      color: #e11d48;
      margin-bottom: 20px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      min-height: 60px;
    }

    .btn {
      padding: 12px 26px;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      outline: none;
    }

    .btn-yes {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
    }

    .btn-no {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
    }

    .btn-think {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
    }

    .celebration {
      display: none;
    }

    .celebration.active {
      display: block;
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    .celebration h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 3rem;
      color: #e11d48;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="contentSection">
      <div class="greeting" id="greetingText">Hey beautiful 👋🏻</div>
      <div class="emoji-box" id="emojiBox">🥺</div>
      <h1 id="mainTitle">Will you be mine?</h1>

      <div class="btn-group" id="btnGroup">
        <button class="btn btn-yes" onclick="handleYes()">Yes 💖</button>
        <button class="btn btn-no" id="noBtn" onclick="handleNo()">No 😜</button>
      </div>
    </div>

    <div class="celebration" id="celebrationSection">
      <div class="emoji-box bounce">🤩🤩🤩</div>
      <h2>Yayyyy! 🎉</h2>
      <p style="font-size: 1.3rem; color: #16a34a; font-weight: 700; margin-top: 10px;">
        I Love You So Much! 💖✨
      </p>
      <p style="font-size: 1rem; color: #4b5563; margin-top: 15px;">
        Aapne mera din aur meri duniya dono hamesha ke liye khoobsurat bana di! 🥰🌸
      </p>
    </div>
  </div>

  <script>
    let step = 1;

    function createHearts() {
      const symbols = ['❤️', '💖', '💕', '💗', '🌸'];
      for (let i = 0; i < 20; i++) {
        const heart = document.createElement('div');
        heart.classList.add('bg-heart');
        heart.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
        heart.style.animationDuration = (Math.random() * 5 + 4) + 's';
        heart.style.animationDelay = (Math.random() * 5) + 's';
        document.body.appendChild(heart);
      }
    }
    createHearts();

    function handleNo() {
      if (step === 1) {
        step = 2;
        document.getElementById('greetingText').style.display = 'none';
        document.getElementById('emojiBox').innerText = '🥺😭';
        document.getElementById('mainTitle').innerText = 'Please Please 🥺';
        
        document.getElementById('btnGroup').innerHTML = `
          <button class="btn btn-yes" onclick="handleYes()">Yes 💖</button>
          <button class="btn btn-no" id="noBtn" onclick="handleNo()">No 😜</button>
          <button class="btn btn-think" onclick="handleSochungi()">Sochungi 🤔</button>
        `;
      } else if (step === 2) {
        goToStep3();
      }
    }

    function handleSochungi() {
      goToStep3();
    }

    function goToStep3() {
      step = 3;
      document.getElementById('greetingText').style.display = 'none';
      document.getElementById('emojiBox').innerText = '😭🥺';
      document.getElementById('mainTitle').innerText = 'Please naa... 🥺❤️';

      document.getElementById('btnGroup').innerHTML = `
        <button class="btn btn-yes" style="transform: scale(1.2);" onclick="handleYes()">Yes 💖</button>
        <button class="btn btn-no" id="noBtn">No 😜</button>
      `;

      makeNoRunaway();
    }

    function makeNoRunaway() {
      const noBtn = document.getElementById('noBtn');
      if (!noBtn) return;

      const moveBtn = () => {
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40) + 20;
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40) + 20;
        
        noBtn.style.position = 'fixed';
        noBtn.style.left = `${x}px`;
        noBtn.style.top = `${y}px`;
        noBtn.style.zIndex = '999';
      };

      noBtn.addEventListener('mouseover', moveBtn);
      noBtn.addEventListener('touchstart', moveBtn);
      noBtn.onclick = moveBtn;
    }

    function handleYes() {
      document.getElementById('contentSection').style.display = 'none';
      document.getElementById('celebrationSection').classList.add('active');

      confetti({
        particleCount: 150,
        spread: 80,
        origin: { y: 0.6 }
      });

      setTimeout(() => {
        confetti({
          particleCount: 100,
          angle: 60,
          spread: 55,
          origin: { x: 0 }
        });
        confetti({
          particleCount: 100,
          angle: 120,
          spread: 55,
          origin: { x: 1 }
        });
      }, 300);
    }
  </script>
</body>
</html>
